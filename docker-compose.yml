services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fso
      POSTGRES_PASSWORD: fso
      POSTGRES_DB: fso
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fso -d fso"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8020}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://fso:fso@postgres:5432/fso
      FRONTEND_ORIGINS: http://localhost:3000,http://localhost:3020,http://127.0.0.1:3020
      STOCKAI_ROOT: /opt/stockai
      FX_ROOT: /opt/fx
      STOCKAI_URL: ${STOCKAI_URL:-http://host.docker.internal:8000}
      FSO_ALLOW_LIVE_DATA: ${FSO_ALLOW_LIVE_DATA:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        API_INTERNAL_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3020}:3000"
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
